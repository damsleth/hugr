[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hugr-cli"
version = "0.4.2"
description = "Meta-CLI and suite hub for the hugr memory suite (yaams, cognitive-ledger, owa-piggy, owa-tools)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Carl Joakim Damsleth" }]
keywords = ["hugr", "memory", "cli", "agent"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Development Status :: 4 - Beta",
]
dependencies = [
  "click>=8.1",
  "hugr-conventions>=0.1",
]

[project.urls]
Homepage = "https://github.com/damsleth/hugr"
Source = "https://github.com/damsleth/hugr"

[project.scripts]
hugr = "hugr.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
]
tui = ["textual>=0.60", "pytest-asyncio>=0.23"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "jinja2>=3.1"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "jinja2>=3.1"]
all = ["hugr-cli[tui,web,server]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hugr*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
reportMissingImports = "error"
