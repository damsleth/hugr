name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Token-based publish via repo secret UV_PUBLISH_TOKEN, mirroring
      # owa-piggy and the local `.env` workflow so the credential lineage
      # stays in one place. The secret is a PyPI API token used as the
      # password with the implicit `__token__` user.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.UV_PUBLISH_TOKEN }}
